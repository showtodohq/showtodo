<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#18181b" />
		<title>ShowTodo · Public Todo List & Daily Checklist</title>
		<!-- 1. 根目录兜底（很多搜索引擎爬虫会默认直接请求 /favicon.ico） -->
		<link rel="shortcut icon" href="/favicon.ico" />
		<!-- 2. 给 Google 及其他搜索引擎的最稳定位图（48x48, 192x192） -->
		<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
		<!-- 3. 给现代浏览器使用的 SVG（支持矢量缩放、清晰锐利） -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<!-- 4. 移动端/苹果设备支持 -->
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<meta name="description" content="Share your public todo list, see what people are doing, and build in public. A frictionless daily checklist and accountability partner platform for founders and developers." />
		<script>
			try {
				const mode = localStorage.getItem('app_theme_mode') || 'system';
				const isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (isDark) document.documentElement.classList.add('dark');
				else document.documentElement.classList.remove('dark');
			} catch (_) {}
		</script>
		%sveltekit.head%
	</head>
	<body class="h-full antialiased" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
