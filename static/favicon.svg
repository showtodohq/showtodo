<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ShowTodo Icon">
  <defs>
    <style>
      :root {
        --bg-fill: #18181b;
        --border-stroke: #27272a;
        --track-stroke: rgba(255, 255, 255, 0.28);
        --mark-stroke: #ffffff;
        --beacon-fill: #38bdf8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-fill: #09090b;
          --border-stroke: #3f3f46;
          --track-stroke: rgba(255, 255, 255, 0.38);
          --mark-stroke: #ffffff;
          --beacon-fill: #38bdf8;
        }
      }
    </style>
  </defs>
  <!-- Background Squircle Container -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" fill="var(--bg-fill)" stroke="var(--border-stroke)" stroke-width="1.5" />
  
  <!-- Broadcast & Progress Ring (Open 270-degree Arc) -->
  <path d="M 16 7.5 A 8.5 8.5 0 1 0 22.5 20.5" fill="none" stroke="var(--track-stroke)" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Focus Beacon Dot -->
  <circle cx="16" cy="7.5" r="1.3" fill="var(--beacon-fill)" />
  
  <!-- Decisive Completed Checkmark -->
  <path d="M 11 16.5 L 14.5 20 L 22.5 11.5" fill="none" stroke="var(--mark-stroke)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
