<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShowTodo Quick Post</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Toast Message -->
  <div id="toast" class="toast"></div>

  <!-- Header -->
  <header class="header">
    <div class="brand">
      <span class="pulse-dot"></span>
      <span>ShowTodo</span>
    </div>
    <div id="user-area" class="user-snippet hidden">
      <div id="user-avatar" class="avatar">U</div>
      <span id="user-name" class="user-name" title="User">User</span>
      <button type="button" id="btn-logout" class="btn-icon" title="Sign out" aria-label="Sign out">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Login View -->
  <main id="view-login" class="login-view hidden">
    <h2 class="login-title">Sign In to ShowTodo</h2>
    <p class="login-subtitle">Google or Email & Password</p>

    <button type="button" id="btn-google-login" class="btn-google">
      <svg width="16" height="16" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <div class="divider"><span>OR</span></div>

    <form id="form-password-login" class="login-form">
      <input type="email" id="login-email" class="form-input" placeholder="Email" required autocomplete="email" />
      <input type="password" id="login-password" class="form-input" placeholder="Password" required autocomplete="current-password" />
      <div id="login-error" class="login-error hidden"></div>
      <button type="submit" id="btn-submit-login" class="btn-login">Sign In</button>
    </form>
  </main>

  <!-- Publish View (All Fields Fully Expanded) -->
  <main id="view-publish" class="content-body hidden">
    <!-- Main Content Input -->
    <textarea id="todo-content" class="main-input" placeholder="What are you going to do today? Show your todo..." rows="2" autofocus></textarea>

    <!-- Note Section (Expanded) -->
    <div class="note-section">
      <textarea id="todo-note" class="note-input" placeholder="Add notes, reference links, action steps..." rows="2"></textarea>
      <label class="checkbox-row">
        <input type="checkbox" id="note-public" checked />
        <span>Public note</span>
      </label>
    </div>

    <!-- Schedule Card (Expanded) -->
    <div class="schedule-card">
      <div class="schedule-header">
        <span>Schedule</span>
        <button type="button" id="btn-clear-schedule" class="btn-clear" title="Clear schedule">Clear</button>
      </div>

      <div class="schedule-grid">
        <!-- Start Date -->
        <div class="schedule-col">
          <div class="schedule-col-header">
            <span>Start Date</span>
            <div class="quick-pills">
              <button type="button" class="quick-pill" data-start="now">Now</button>
              <button type="button" class="quick-pill" data-start="tomorrow">Tmr</button>
              <button type="button" class="quick-pill" data-start="nextMonday">Mon</button>
            </div>
          </div>
          <input type="datetime-local" id="start-date" class="datetime-input" />
        </div>

        <!-- Due Date -->
        <div class="schedule-col">
          <div class="schedule-col-header">
            <span>Due Date</span>
            <div class="quick-pills">
              <button type="button" class="quick-pill" data-due="eod">EOD</button>
              <button type="button" class="quick-pill" data-due="tomorrow">Tmr</button>
              <button type="button" class="quick-pill" data-due="nextWeek">+1w</button>
            </div>
          </div>
          <input type="datetime-local" id="due-date" class="datetime-input" />
        </div>
      </div>

      <div id="time-error" class="time-error hidden">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>Start date cannot be later than due date</span>
      </div>
    </div>

    <!-- Category Pills (Single source from categories.ts) -->
    <div id="category-container" class="category-row">
      <!-- Populated dynamically via constants.js -->
    </div>

    <!-- Footer Bar -->
    <div class="footer-bar">
      <span class="shortcut-hint">⌘↵ to post</span>
      <button type="button" id="btn-post" class="btn-post" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span id="btn-post-text">Post</span>
      </button>
    </div>
  </main>

  <!-- Environment Host Switcher Footer -->
  <footer class="env-bar">
    <span>API: <strong id="current-api-label">...</strong></span>
    <button type="button" id="btn-toggle-env" class="env-link">Switch to Localhost</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
